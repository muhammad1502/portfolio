<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldnote | Notes that organise themselves</title>
    <meta
      name="description"
      content="Fieldnote is a sample product page from the apple-web-design template. Replace this with a one or two sentence description of the site."
    />
    <meta name="theme-color" content="#fafafc" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social share. Absolute URLs: replace example.com with the
         live domain here and in public/ (sitemap.xml, robots.txt, llms.txt,
         .well-known/security.txt). Bump ?v= when og.png changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fieldnote" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Fieldnote | Notes that organise themselves" />
    <meta property="og:description" content="Capture an idea in two taps, find it again in one." />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:image" content="https://example.com/og.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fieldnote: notes that organise themselves" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fieldnote | Notes that organise themselves" />
    <meta name="twitter:description" content="Capture an idea in two taps, find it again in one." />
    <meta name="twitter:image" content="https://example.com/og.png?v=1" />

    <link rel="canonical" href="https://example.com" />

    <!-- Structured data for search engines and AI crawlers. Use the schema.org
         type that fits: Organization, Product, SoftwareApplication, Person… -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Fieldnote",
        "url": "https://example.com",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "iOS, Android, Web",
        "description": "Notes that organise themselves."
      }
    </script>

    <!-- Pre-paint theme (see public/theme-init.js). Render-blocking on purpose
         so the right background is set before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
