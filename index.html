    <!-- Pre-paint: resolve the theme and set <html data-theme> + background
         before React mounts, so dark-mode users never see a light flash (FOUC).
         Mirrors src/app/lib/useThemeMode.ts (same storage key). Also enables the
         scroll-reveal styles only when they can work (IntersectionObserver, no
         reduced-motion preference) — otherwise content is never hidden. -->
    <script>
      (function () {
        var root = document.documentElement;
        var dark = false;
        try {
          var stored = localStorage.getItem('theme-mode');
          dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.backgroundColor = dark ? '#000000' : '#ffffff';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#161617' : '#fafafc');
        try {
          if (
            'IntersectionObserver' in window &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches &&
            !/[?&]print(=|&|$)/.test(location.search)
          ) {
            root.classList.add('reveal-ready');
          }
        } catch (e) {}
      })();
    </script>
